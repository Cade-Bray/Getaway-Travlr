<div style="background-color: #2c9688;">
  <nav class="navbar navbar-expand navbar-light sticky-top ">
    <a class="navbar-brand" href="#">
      <img ngSrc="/assets/images/logo.png" alt="Logo" height="100" width="200" priority>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="active navbar-brand" routerLink="" style="color: floralwhite; font-size: x-large">
          Trips <span class="sr-only ">(current)</span>
        </a>
      </div>
    </div>
    <div class="navbar-end ">
      @if (isLoggedIn()) {
        <button
          (click)="onLogout()"
          class="btn btn-info nav-item m-3 me-md-5"
          style="background-color: floralwhite; color: #2c9688; border-color: floralwhite">
          Log Out
        </button>
      } @else {
        <button
          routerLink="login"
          class="btn btn-info nav-item m-3 me-md-5"
          style="background-color: floralwhite; color: #2c9688; border-color: floralwhite">
          Log In
        </button>
      }
    </div>
  </nav>
</div>
