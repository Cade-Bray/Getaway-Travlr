<div class="col-md-4 container-fluid mt-3">
  <h2 class="text-center">Edit Trip</h2>
  @if (editForm) {
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="">
      <div class="form-group">
        @for (key of Object.keys(editForm.controls); track key){
          @if (!(key === '_id')) {
            <label class="mt-3">{{key | titlecase}}:</label>
            @if (key === 'description') {
              <textarea
                [formControlName]="key"
                [placeholder]="key"
                class="form-control"
                rows="10"
                cols="40"
                [ngClass]="{'is-invalid': submitted && f[key].errors}">
              </textarea>
            } @else {
              <input
                [type]="key === 'start' ? 'date' : 'text'"
                [formControlName]=key
                [placeholder]=key
                class="form-control"
                [ngClass]="{'is-invalid': submitted && f[key].errors}">
            }

            @if (submitted && f[key].errors) {
              @if (f[key].errors['required']) {
                <div class="text-center"><b>{{ key | titlecase }} is required</b></div>
              }
            }
          }
        }
      </div>
      <button type="submit" class="btn btn-info my-3">Save</button>
      <button type="button" (click)="deleteTrip()" class="btn btn-info my-3 ms-3">Delete</button>
    </form>
  }
</div>
